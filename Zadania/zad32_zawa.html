<body bgcolor="yellow"> 
  <div style="color:green;font-size:42px;"> 
   <script type="text/javascript"> 
              function komputer(marka_zaw,procesor_zaw,ram_zaw)   //początek konstruktora 
  { 
   this.marka=marka_zaw; 
   this.procesor=procesor_zaw; 
   this.ram=ram_zaw;   
  }                                         //koniec konstruktora 
              komputer.prototype.wypisz = function () //definicja metody 
      { 
         alert(this.marka + " " + this.procesor+ " " + this.ram); 
      }; 
  var komputer1 = new komputer("Dell", "Intel i7", "8gb ddr4"); // nowy obiekt osoba1 
  var komputer2 = new komputer("Lenovo", "Ryzen 5", "16gb ddr4"); // nowy obiekt osoba2 
 
 komputer1.wypisz(); // uruchomienie metody wypisz() dotyczącej osoby1 z użyciem alert(); 
 komputer2.wypisz(); // uruchomienie metody wypisz() dotyczącej osoby2 z użyciem alert(); 
                document.write("Moje nazwisko to ZAWADZKI  mam numer 24 a obiekt to komputer"+"<br>"); 
                document.write("dostęp do pól komputer1 i  komputer2"+"<br>"); 
                document.write("czyli wypisanie danych"+"<br>"); 
 
// poniżej dostęp/wypisanie danych  do pól osoby1 i  osoba2 
 document.write("klient pierwszy =>"+"   "+komputer1.marka+"   "+komputer1.procesor+"   "+komputer1.ram+"<br>"); 
 document.write("klient drugi =>"+"   "+komputer2.marka+"   "+komputer2.procesor+"   "+komputer2.ram+"<br>"); 
   </script> 
 </div>
