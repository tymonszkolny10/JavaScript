<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kod zadania 16 - Zawadzki 2P</title>
</head>
<body>
	<textarea cols="200" rows="45" readonly>
		<!DOCTYPE html>
		<html lang="pl">
		<head>
			<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
			<title>Zawadzki 2P - Zadanie 16</title>
		</head>
		<body>
			<script>
				var daneA_zaw = prompt("Podaj pierwszą liczbę A=", "1");
				var daneB_zaw = prompt("Podaj drugą liczbę B=", "2");
				var A_zaw = Number(daneA_zaw);
				var B_zaw = Number(daneB_zaw);

				if (daneA_zaw === null || daneB_zaw === null) {
					document.write("Anulowano podawanie liczb.");
				} else if (daneA_zaw.trim() === "" || daneB_zaw.trim() === "" ||
						!Number.isSafeInteger(A_zaw) || !Number.isSafeInteger(B_zaw) ||
						A_zaw < 0 || B_zaw < 0) {
					document.write("Podaj dwie liczby naturalne.");
				} else {
					var A3_zaw = A_zaw * A_zaw * A_zaw;
					var skladnik2_zaw = 3 * A_zaw * A_zaw * B_zaw;
					var skladnik3_zaw = 3 * A_zaw * B_zaw * B_zaw;
					var B3_zaw = B_zaw * B_zaw * B_zaw;
					var suma_zaw = A3_zaw + skladnik2_zaw + skladnik3_zaw + B3_zaw;
					var wynik_zaw = "(" + A_zaw + " + " + B_zaw + ")^3 = " +
						A_zaw + "^3 + 3*(" + A_zaw + "^2)*(" + B_zaw + ") + " +
						"3*(" + A_zaw + ")*(" + B_zaw + "^2) + " + B_zaw + "^3 = " +
						A3_zaw + " + " + skladnik2_zaw + " + " + skladnik3_zaw + " + " +
						B3_zaw + " = " + suma_zaw;

					document.write("<div style='color: navy; font: 28px Arial;'>Wczytane liczby: A=" + A_zaw + " &nbsp; B=" + B_zaw + "</div>");
					document.write("<div id='wynik_zaw' style='color: navy; font-family: Arial; font-size: 50px; white-space: nowrap;'></div>");
					document.getElementById("wynik_zaw").textContent = wynik_zaw;

					var canvas_zaw = document.createElement("canvas");
					var kontekst_zaw = canvas_zaw.getContext("2d");
					kontekst_zaw.font = "50px Arial";
					var szerokoscWyniku_zaw = kontekst_zaw.measureText(wynik_zaw).width;
					var szerokoscOkna_zaw = document.documentElement.clientWidth;
					var rozmiarCzcionki_zaw = Math.min(50, Math.floor(50 * szerokoscOkna_zaw / szerokoscWyniku_zaw));
					document.getElementById("wynik_zaw").style.fontSize = Math.max(12, rozmiarCzcionki_zaw) + "px";
				}
			</script>
		</body>
		</html>
	</textarea>
</body>
</html>
