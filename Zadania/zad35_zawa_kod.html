<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <textarea cols="140" rows="40">
        <!DOCTYPE html>  
        <html lang="pl-PL">  
            <head>
            <meta charset="utf-8">               <!-- polskie litery mają działad(uzupełnij w kodzie strony meta) --> 
            <title>Z35 Zawadzki</title>      
            </head>                    <!-- title -> Z35 oraz nazwisko ucznia --> 
            <body> 
        <div style="color:red;font-size:50px;"> 
            <script language="JavaScript"> 
        var x=prompt("podaj liczbę x=",""); 
                    var a_dana_zaw=parseFloat(x); 
        //zmien zmienną „a” na a_dana_kow 
            document.write("czytana liczba x="+a_dana_zaw+"<br>");     
                    if(a_dana_zaw>0) 
                            document.write("czytana liczba jest większa od 0"+"<br>");

                        // Dokoocz dwa pozostałe przypadki a==0   i  a<0 

                        if(a_dana_zaw==0)
                            document.write("Czytana liczba jest równa 0 <br>");  

                        if(a_dana_zaw<0)
                            document.write("Czytana liczba jest mniejsza od 0 <br>");       
                        
            </script> 
        </div> 
        </body> 
        </html> 
        <!--  Zawadzki Z35_JS  -->
    </textarea>
</body>
</html>
