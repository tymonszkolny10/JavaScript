<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Zawadzki 2P - Zadanie 16</title>
</head>
<body>
	<script>
		var daneA_zaw = prompt("Podaj pierwszą liczbę A=", "1");
		var daneB_zaw = prompt("Podaj drugą liczbę B=", "2");
		var A_zaw = Number(daneA_zaw);
		var B_zaw = Number(daneB_zaw);

		if (daneA_zaw === null || daneB_zaw === null) {
			document.write("Anulowano podawanie liczb.");
		} else if (daneA_zaw.trim() === "" || daneB_zaw.trim() === "" ||
				   !Number.isSafeInteger(A_zaw) || !Number.isSafeInteger(B_zaw) ||
				   A_zaw < 0 || B_zaw < 0) {
			document.write("Podaj dwie liczby naturalne.");
		} else {
			var wynik_zaw = `(${A_zaw} + ${B_zaw})^3 = ${A_zaw}^3 + 3*(${A_zaw}^2)*(${B_zaw}) + 3*(${A_zaw})*(${B_zaw}^2) + ${B_zaw}^3 = ${A_zaw ** 3} + ${3 * A_zaw ** 2 * B_zaw} + ${3 * A_zaw * B_zaw ** 2} + ${B_zaw ** 3} = ${A_zaw ** 3 + 3 * A_zaw ** 2 * B_zaw + 3 * A_zaw * B_zaw ** 2 + B_zaw ** 3}`;

			document.write(`<div style="color: navy; font: 28px Arial;">Wczytane liczby: A=${A_zaw} &nbsp; B=${B_zaw}</div>`);
			document.write(`<div style="color: navy; font: 50px Arial; overflow-wrap: anywhere;">${wynik_zaw}</div>`);
		}
	</script>
</body>
</html>
