    <title>Z37 Zawadzki</title>
</head>
<body>
    <script>
        var rok_zaw=parseFloat(prompt("Podaj rok = ",""));

        document.write("Wczytany rok = " + rok_zaw + "<br>");

        if(rok_zaw==1995) {
            document.write("<font color=blue size=4>Brawo znasz rok od kiedy działa Javasript</font><br>");
            
        }
        else {
            document.write("<font color=red size=7>Źle musisz jeszcze poczytad</font>");
        }
    </script>
</body>
